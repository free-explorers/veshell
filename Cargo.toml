[package]
name = "veshell"
version = "0.1.0"
description = "An innovative not-desktop environment for Linux made with modern technologies like Flutter and Rust."
authors = ["Adrien Peslerbe <adrien@pesler.be>"]
license = "GPL-3.0-or-later"
edition = "2021"
repository = "https://github.com/free-explorers/veshell"
build = "extra/build/mod.rs"
default-run = "veshell"

[package.metadata]
flutter_version = "3.47.2"

[[bin]]
name = "veshell"
path = "src/embedder/main.rs"

[profile.profile]
inherits = "release"

[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "4cf0b62028039661477d482ec4758b687d8f4392"
default-features = false

features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_vulkan",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "renderer_multi",
    "renderer_pixman",
    "use_system_lib",
    "wayland_frontend",
    "xwayland",
]

[dependencies]

smithay-drm-extras = { git = "https://github.com/Smithay/smithay.git", rev = "4cf0b62028039661477d482ec4758b687d8f4392" }
rustix = "0.38.30"
input-linux = "0.7.1"
tracing-subscriber = { version = "0.3.17", features = [
    "env-filter",
    "time",
    "chrono",
    "ansi",
] }
log = "0.4.20"
tracing = { version = "0.1.37", features = [] }
profiling = "1.0.11"
thiserror = "1.0.49"
xcursor = "0.3.4"
serde = { version = "1.0.189", features = ["derive"] }
serde_json = "1.0.107"
lazy_static = { version = "1.4.0", features = [] }
rlimit = "0.10.1"
tracing-appender = "0.2"
chrono = "0.4"
xkbcommon = "0.8.0"
backtrace = "0.3"
notify = "8.0.0"
sd-notify = "0.4.3"
uuid = { version = "1.16.0", features = ["v4"] }
bitflags = "2.2.1"
png = "0.17.16"
xdg-user = "0.2.1"
zbus = "5"
# NameOwnerChanged subscription streams (kept minimal; only StreamExt)
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-channel = "2"
pipewire = "0.10.1"
pipewire-sys = "0.10.1"
libc = "0.2.189"
gstreamer = "0.24.5"
gstreamer-app = "0.24.5"
fontdue = "0.9"


[build-dependencies]
bindgen = "0.69.1"
bytes = "1.5.0"
reqwest = { version = "0.11.22", features = ["blocking"] }
tar = "0.4.43"
flate2 = "1.0.35"
sha256 = "1.5.0"
lazy_static = { version = "1.4.0", features = [] }
cargo_metadata = "0.19.1"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.generate-rpm]
# Fedora font package names; other RPM distributions may override these.
requires = { fontconfig = "*", google-roboto-fonts = "*", google-noto-sans-fonts = "*", google-noto-sans-arabic-fonts = "*", google-noto-sans-bengali-fonts = "*", google-noto-sans-devanagari-fonts = "*", google-noto-sans-cjk-fonts = "*" }
assets = [
    { source = "build/package-root/usr/bin/*", dest = "/usr/bin/", mode = "755" },
    { source = "build/package-root/usr/lib/veshell/**/*", dest = "/usr/lib/veshell/", mode = "644" },
    { source = "build/package-root/usr/lib/systemd/user/*", dest = "/usr/lib/systemd/user/", mode = "644" },
    { source = "build/package-root/usr/share/veshell/**/*", dest = "/usr/share/veshell/", mode = "644" },
    { source = "build/package-root/usr/share/wayland-sessions/*", dest = "/usr/share/wayland-sessions/", mode = "644" },
    { source = "build/package-root/usr/share/xdg-desktop-portal/**/*", dest = "/usr/share/xdg-desktop-portal/", mode = "644" },
]

[package.metadata.deb]
depends = "$auto, fontconfig, fonts-roboto, fonts-noto-core, fonts-noto-cjk"
preserve-symlinks = true
assets = [
    ["build/package-root/usr/bin/*", "usr/bin/", "755"],
    ["build/package-root/usr/lib/veshell/**/*", "usr/lib/veshell/", "644"],
    ["build/package-root/usr/lib/systemd/user/*", "usr/lib/systemd/user/", "644"],
    ["build/package-root/usr/share/veshell/**/*", "usr/share/veshell/", "644"],
    ["build/package-root/usr/share/wayland-sessions/*", "usr/share/wayland-sessions/", "644"],
    ["build/package-root/usr/share/xdg-desktop-portal/**/*", "usr/share/xdg-desktop-portal/", "644"],
]
