name: Complete Flutter Bump

# Fills the two fields a Bump Flutter Version pull request cannot know when it
# opens, once the engine builds land: the prebuilt engine's sha256 in
# nix/flutter-artifacts.json, and the engine-repository pin in
# nix/engine-repository.json. The engine repositories dispatch it when their
# builds finish, so the bump never holds a runner waiting and nothing polls.

on:
  # The engine repositories dispatch this when their builds finish, so there
  # is no polling; workflow_dispatch is the manual escape hatch.
  repository_dispatch:
    types: [flutter-bump]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

env:
  ENGINE_NIX_REPO: free-explorers/flutter-engine-nix
  ENGINE_REPO: free-explorers/flutter-engine

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Complete each pending bump pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Veshell release bot"
          git config user.email "releases@veshell.invalid"
          mapfile -t branches < <(
            gh pr list --state open --json headRefName --jq '.[].headRefName' | grep -E '^bump/flutter-v' || true
          )
          if (( ${#branches[@]} == 0 )); then
            echo "no pending bump pull requests" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          for branch in "${branches[@]}"; do
            echo "== $branch ==" | tee -a "$GITHUB_STEP_SUMMARY"
            git fetch -q origin "$branch"
            git checkout -q -B "$branch" "origin/$branch"
            changed=0
            version=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["metadata"]["flutter_version"])')
            revision=$(python3 -c 'import json,re;d=json.load(open("nix/flutter-artifacts.json"));print(re.search(r"[0-9a-f]{40}", d[sys.argv[1]]["engine"]["url"]).group(0))' "$version")

            if ! python3 -c 'import json,sys;d=json.load(open("nix/flutter-artifacts.json"));sys.exit(0 if d[sys.argv[1]]["engine"].get("sha256") else 1)' "$version"; then
              url=$(gh release view "linux-engine-sdk-release-x86_64-$revision" --repo "$ENGINE_REPO" \
                --json assets --jq '.assets[] | select(.name | endswith(".tar.gz.sha256")) | .url' 2>/dev/null | head -1 || true)
              if [[ -n "$url" ]]; then
                value=$(gh api "$url" -H "Accept: application/octet-stream" | awk '{print $1}')
                python3 - "$version" "$value" <<'PY'
          import json, sys
          version, value = sys.argv[1:3]
          path = "nix/flutter-artifacts.json"
          data = json.load(open(path))
          data[version]["engine"]["sha256"] = value
          json.dump(dict(sorted(data.items())), open(path, "w"), indent=2)
          PY
                echo "engine sha256 filled" | tee -a "$GITHUB_STEP_SUMMARY"
                changed=1
              else
                echo "prebuilt engine not published yet" | tee -a "$GITHUB_STEP_SUMMARY"
              fi
            fi

            pinned=$(python3 -c 'import json;print(json.load(open("nix/engine-repository.json"))["revision"])')
            engine_rev=$(gh api "repos/$ENGINE_NIX_REPO/commits?path=engine-source.json&per_page=1" --jq '.[0].sha' 2>/dev/null || true)
            if [[ -n "$engine_rev" && "$engine_rev" != "$pinned" ]]; then
              has=$(gh api "repos/$ENGINE_NIX_REPO/contents/engine-source.json?ref=$engine_rev" \
                -H "Accept: application/vnd.github.raw" \
                | python3 -c 'import json,sys;print("yes" if sys.argv[1] in json.load(sys.stdin) else "no")' "$version")
              if [[ "$has" == "yes" ]]; then
                # builtins.fetchTarball wants the unpacked NAR hash, not the tarball file hash.
                sha=$(nix-prefetch-url --unpack "https://github.com/$ENGINE_NIX_REPO/archive/$engine_rev.tar.gz" | tail -1)
                python3 - "$engine_rev" "$sha" <<'PY'
          import json, sys
          revision, sha = sys.argv[1:3]
          path = "nix/engine-repository.json"
          data = json.load(open(path))
          data["revision"] = revision
          data["sha256"] = sha
          open(path, "w").write(json.dumps(data, indent=2) + "\n")
          PY
                echo "engine repository pin moved to ${engine_rev:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"
                changed=1
              fi
            fi

            if (( changed )); then
              git add nix/flutter-artifacts.json nix/engine-repository.json
              git commit -m "nix: complete the Flutter $version bump"
              git push origin "$branch"
            fi
          done
