name: Bump Flutter Version

# One action to move to a new Flutter release. It resolves the version's
# provenance, drives the two engine repositories, and opens a reviewed
# bump/flutter-v<version> pull request. Merging that PR is what triggers the
# engine cache (#95) and, later, the release (#99).
#
# Requires BUMP_TOKEN: a fine-grained token with Actions: write on
# free-explorers/flutter-engine-nix and free-explorers/flutter-engine.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Flutter release to move to (for example 3.50.0)
        required: true
        type: string
      channel:
        description: Flutter channel
        required: true
        default: stable
        type: choice
        options: [stable, beta, dev]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-flutter
  cancel-in-progress: false

env:
  ENGINE_NIX_REPO: free-explorers/flutter-engine-nix
  ENGINE_REPO: free-explorers/flutter-engine
  ENGINE_MODE: release

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Guard the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: version must be x.y.z" >&2; exit 1; }
          current=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["metadata"]["flutter_version"])')
          [[ "$current" != "$VERSION" ]] || { echo "error: already on Flutter $VERSION" >&2; exit 1; }
          if git ls-remote --exit-code --heads origin "bump/flutter-v$VERSION" >/dev/null 2>&1; then
            echo "error: branch bump/flutter-v$VERSION already exists" >&2; exit 1
          fi
          git checkout -b "bump/flutter-v$VERSION"

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            max-jobs = 1
            cores = 4
            experimental-features = nix-command flakes

      - name: Resolve the engine revision
        id: engine
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          revision=$(curl -fsSL "https://raw.githubusercontent.com/flutter/flutter/$VERSION/bin/internal/engine.version" | tr -d '\n')
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "error: bad engine revision '$revision'" >&2; exit 1; }
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Drive the engine repositories
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ steps.engine.outputs.revision }}
          MODE: ${{ env.ENGINE_MODE }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$ENGINE_NIX_REPO" --ref main -f flutter_version="$VERSION"
          gh workflow run engine-release.yml --repo "$ENGINE_REPO" --ref main -f mode="$MODE" -f revision="$REVISION" -f publish=true

      - name: Probe the Nix SDK hashes
        id: nix
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          REVISION: ${{ steps.engine.outputs.revision }}
        run: |
          set -euo pipefail
          to_sri() { nix hash convert --to sri --hash-algo sha256 "$1" 2>/dev/null || nix hash to-sri --type sha256 "$1"; }
          note() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          flutter_hash=$(to_sri "$(nix-prefetch-url --unpack "https://github.com/flutter/flutter/archive/$VERSION.tar.gz")")
          dart_version=$(python3 -c 'import json,urllib.request as u;d=json.load(u.urlopen("https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"));print(next(r["dart_sdk_version"] for r in d["releases"] if r["version"]=="'"$VERSION"'" and r["channel"]=="'"$CHANNEL"'"))')
          dart_hash=$(to_sri "$(nix-prefetch-url --type sha256 "https://storage.googleapis.com/dart-archive/channels/stable/release/$dart_version/sdk/dartsdk-linux-x64-release.zip")")

          # Seed the pin (with fake hashes for the two generated ones) so the
          # probe tool can read it, and point Cargo.toml at the new version.
          python3 - "$VERSION" "$REVISION" "$flutter_hash" "$dart_version" "$dart_hash" <<'PY'
          import json, re, sys
          version, engine, fh, dv, dh = sys.argv[1:6]
          cargo = open("Cargo.toml").read()
          open("Cargo.toml", "w").write(re.sub(r'(?m)^(flutter_version\s*=\s*)"[^"]*"', rf'\g<1>"{version}"', cargo))
          path = "nix/flutter-sdk.json"
          data = json.load(open(path))
          data[version] = {
              "engineVersion": engine, "flutterHash": fh, "dartVersion": dv,
              "dartHash": {"x86_64-linux": dh},
              "artifactHashes": {"universal": {"x86_64-linux": "sha256-AAAA"}, "linux": {"x86_64-linux": "sha256-AAAA"}},
              "toolsLockHash": "sha256-AAAA",
          }
          json.dump(dict(sorted(data.items())), open(path, "w"), indent=2)
          PY

          # The generated artifact hashes (nixpkgs runs the Flutter tool); the
          # build fails with the real value, keyed by the derivation name.
          pf='let f = builtins.getFlake (toString ./.); p = f.inputs.nixpkgs.legacyPackages.x86_64-linux;'
          set_hash() {
            python3 - "$VERSION" "$1" "$2" "$3" <<'PY'
          import json, sys
          version, path, section, value = sys.argv[1:5]
          data = json.load(open(path))
          if section != "toolsLock":
              platform, system = section.split(".")
              data[version]["artifactHashes"][platform][system] = value
          else:
              data[version]["toolsLockHash"] = value
          json.dump(dict(sorted(data.items())), open(path, "w"), indent=2)
          PY
          }
          resolved=false
          for _ in $(seq 1 8); do
            log=$(mktemp)
            nix build --impure --no-link --print-out-paths --expr "${pf} in (import ./nix/flutter-sdk-update.nix { pkgs = p; artifactHash = p.lib.fakeHash; flutterPlatform = \"universal\"; }).artifacts" >"$log" 2>&1 || true
            value=$(grep -oE 'got: +sha256-[A-Za-z0-9+/=]+' "$log" | head -1 | awk '{print $2}')
            [[ -n "$value" ]] || { note "universal artifact hash resolved"; break; }
            set_hash nix/flutter-sdk.json universal.x86_64-linux "$value"
          done
          for _ in $(seq 1 8); do
            log=$(mktemp)
            nix build --impure --no-link --print-out-paths --expr "${pf} in (import ./nix/flutter-sdk-update.nix { pkgs = p; artifactHash = p.lib.fakeHash; flutterPlatform = \"linux\"; }).artifacts" >"$log" 2>&1 || true
            value=$(grep -oE 'got: +sha256-[A-Za-z0-9+/=]+' "$log" | head -1 | awk '{print $2}')
            [[ -n "$value" ]] || { note "linux artifact hash resolved"; break; }
            set_hash nix/flutter-sdk.json linux.x86_64-linux "$value"
          done
          for _ in $(seq 1 8); do
            log=$(mktemp)
            nix build --impure --no-link --print-out-paths --expr "${pf} in (import ./nix/flutter-sdk-update.nix { pkgs = p; lockHash = p.lib.fakeHash; }).toolsLock" >"$log" 2>&1 || true
            value=$(grep -oE 'got: +sha256-[A-Za-z0-9+/=]+' "$log" | head -1 | awk '{print $2}')
            [[ -n "$value" ]] || { note "tools lock hash resolved"; break; }
            set_hash nix/flutter-sdk.json toolsLock "$value"
          done
          if grep -q 'sha256-AAAA' nix/flutter-sdk.json; then
            echo "error: could not resolve every generated hash; see the run log" >&2; exit 1
          fi
          {
            echo "flutter_hash=$flutter_hash"
            echo "dart_hash=$dart_hash"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the provenance and write the pin
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          pin=$(python3 -c 'import json,sys;d=json.load(open("nix/flutter-sdk.json"));e=d[sys.argv[1]];print(e["artifactHashes"]["universal"]["x86_64-linux"]);print(e["artifactHashes"]["linux"]["x86_64-linux"]);print(e["toolsLockHash"])' "$VERSION")
          universal=$(printf '%s\n' "$pin" | sed -n 1p)
          linux=$(printf '%s\n' "$pin" | sed -n 2p)
          tools_lock=$(printf '%s\n' "$pin" | sed -n 3p)
          # The engine.sha256 is filled by Complete Flutter Bump once the
          # prebuilt engine release exists.
          python3 nix/bump-flutter.py \
            --version "$VERSION" --channel "$CHANNEL" \
            --flutter-hash "${{ steps.nix.outputs.flutter_hash }}" \
            --dart-hash "${{ steps.nix.outputs.dart_hash }}" \
            --artifact-hash-universal "$universal" \
            --artifact-hash-linux "$linux" \
            --tools-lock-hash "$tools_lock"

      - name: Commit and open the bump pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          git config user.name "Veshell release bot"
          git config user.email "releases@veshell.invalid"
          git add Cargo.toml nix/flutter-sdk.json nix/flutter-artifacts.json
          git commit -m "nix: bump Flutter to $VERSION"
          git push -u origin "bump/flutter-v$VERSION"
          cat > "$RUNNER_TEMP/body.md" <<EOF
          Bump Flutter to **$VERSION** ($CHANNEL).

          - engine revision \`${{ steps.engine.outputs.revision }}\`
          - drives free-explorers/flutter-engine-nix and free-explorers/flutter-engine
          - provisioning the CDN artifact hashes and the Nix SDK hashes

          Merging this triggers the engine cache.
          EOF
          gh pr create --base main --head "bump/flutter-v$VERSION" \
            --title "Bump Flutter to $VERSION" --body-file "$RUNNER_TEMP/body.md"
