name: Release

# Runs on every push to main, but only acts when the version in Cargo.toml has no
# tag yet: that is a merged release pull request. It then publishes everywhere:
# syncs the packaging manifest, triggers the distro pipeline (payloads, AUR,
# COPR, OBS, smoke), tags the commit and creates the product release. The body
# of the merged release pull request becomes the release notes.
#
# Requires the PACKAGING_TOKEN secret: a fine-grained token with Contents: write
# on free-explorers/veshell-packaging.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VESHELL_REPO: free-explorers/veshell
  PACKAGING_REPO: free-explorers/veshell-packaging

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Decide whether this commit is an unreleased version
        id: decide
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists; nothing to release" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect the release notes from the merged pull request
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          body=$(gh api "repos/${{ github.repository }}/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""')
          if [[ -z "$body" ]]; then
            body="Release $TAG."
          fi
          printf '%s\n' "$body" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Sync the packaging manifest and recipes
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${PACKAGING_REPO}.git" packaging
          git -C packaging config user.name "Veshell release bot"
          git -C packaging config user.email "releases@veshell.invalid"
          python3 packaging/scripts/prepare-release.py \
            --version "$VERSION" --commit "$GITHUB_SHA" --veshell-src "$GITHUB_WORKSPACE"
          git -C packaging add --all
          git -C packaging commit --quiet -m "release: v$VERSION"
          git -C packaging push --quiet origin HEAD:main

      - name: Publish the packaging release (triggers the distro pipeline)
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$PACKAGING_REPO" --target main \
            --title "$TAG" --notes "Packaging artifacts for Veshell $TAG."

      - name: Tag and create the product release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push --quiet origin "$TAG"
          gh release create "$TAG" --repo "$VESHELL_REPO" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
