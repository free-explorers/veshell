name: Release

# Publishes a GitHub release to the distribution channels.
#
# Triggered when a release is published. The release tag must match
# packaging/release.json (for example v0.2.0-beta.1). The manifest is the single
# source of truth; the workflow verifies the recipes are rendered from it, then
# builds the prebuilt payload and pushes the AUR packages.
#
# Optional channel secrets. Each channel job is skipped when its secret is
# absent, so a release still succeeds before the channels are configured:
#   AUR_SSH_PRIVATE_KEY   SSH private key authorized for AUR (user `aur`)
#   COPR_CONFIG           copr-cli config content (login/username/token)
#   OSC_CONFIG            oscrc content (OBS apiurl + credentials)
#
# Optional repository variables (defaults shown):
#   COPR_PROJECT          free-explorers/veshell
#   OBS_PROJECT           home:free-explorers
#   OBS_PACKAGE           veshell
#
# The Nix channel reuses the attested-closure workflow
# (nix-package-release.yml) and requires the separately published
# free-explorers/flutter-engine-nix engine release to exist.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.2.0-beta.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  validate:
    if: github.repository == 'free-explorers/veshell'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.manifest.outputs.release_id }}
      tag: ${{ steps.manifest.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the tag against the release manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:?a release tag is required}"
          release_id="$(python3 -c 'import json; m = json.load(open("packaging/release.json")); p = m.get("prerelease"); print((m["version"] + "-" + p) if p else m["version"])')"
          if [[ "${tag#v}" != "$release_id" ]]; then
            printf 'error: tag %s does not match packaging/release.json (%s)\n' "$tag" "$release_id" >&2
            printf '       expected tag v%s\n' "$release_id" >&2
            exit 1
          fi
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Verify the recipes are rendered from the manifest
        run: python3 packaging/scripts/render-recipes.py --check

  prebuilt:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      prebuilt_sha: ${{ steps.publish.outputs.prebuilt_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reclaim host disk for the container build
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the prebuilt payload in an Arch Linux container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            archlinux:base-devel \
            bash /work/packaging/ci/prebuilt-in-container.sh
          sudo chown -R "$(id -u):$(id -g)" out
          test -f out/SHA256SUMS
          cat out/SHA256SUMS

      - name: Attest the prebuilt checksum manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v2
        with:
          subject-path: out/SHA256SUMS

      - name: Publish the prebuilt assets to the release
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          prebuilt_sha="$(cut -d' ' -f1 out/SHA256SUMS)"
          printf 'prebuilt_sha=%s\n' "$prebuilt_sha" >> "$GITHUB_OUTPUT"
          gh release upload "$RELEASE_TAG" \
            out/veshell-*.tar.zst out/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

  aur:
    needs: [validate, prebuilt]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install tooling
        shell: bash
        run: |
          set -euo pipefail
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed base-devel git openssh python sudo
          id build >/dev/null 2>&1 || useradd -m build

      - name: Prepare the source AUR package
        shell: bash
        run: |
          set -euo pipefail
          work="$(pwd)"
          chown -R build:build "$work/packaging/arch"
          sudo -u build bash -c "cd '$work/packaging/arch' && makepkg --printsrcinfo" \
            > "$work/packaging/arch/.SRCINFO"
          head -n 15 "$work/packaging/arch/.SRCINFO"

      - name: Generate the binary AUR package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aur-bin
          python3 packaging/scripts/gen-bin-recipes.py --format aur \
            --prebuilt-sha "${{ needs.prebuilt.outputs.prebuilt_sha }}" \
            --tag "$RELEASE_TAG" \
            --out /tmp/aur-bin
          chown -R build:build /tmp/aur-bin
          sudo -u build bash -c "cd /tmp/aur-bin && makepkg --printsrcinfo" \
            > /tmp/aur-bin/.SRCINFO
          head -n 15 /tmp/aur-bin/.SRCINFO

      - name: Publish to the AUR
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not configured; skipping the AUR publish." >&2
            exit 0
          fi
          key="$RUNNER_TEMP/aur_key"
          install -d -m700 "$(dirname "$key")"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          AUR_SSH_KEY="$key" packaging/scripts/aur-publish.sh veshell packaging/arch
          AUR_SSH_KEY="$key" packaging/scripts/aur-publish.sh veshell-bin /tmp/aur-bin

  copr:
    name: Publish to COPR
    needs: [validate, prebuilt]
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install tooling
        shell: bash
        run: dnf install -y git python3 rpm-build copr-cli gh

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Render the binary recipe and submit to COPR
        shell: bash
        env:
          COPR_CONFIG_CONTENT: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT || 'free-explorers/veshell' }}
        run: |
          set -euo pipefail
          if [[ -z "${COPR_CONFIG_CONTENT:-}" ]]; then
            echo "COPR_CONFIG is not configured; skipping the COPR publish." >&2
            exit 0
          fi
          printf '%s\n' "$COPR_CONFIG_CONTENT" > "$RUNNER_TEMP/copr"
          rm -rf /tmp/rpm-bin
          python3 packaging/scripts/gen-bin-recipes.py --format rpm \
            --prebuilt-sha "${{ needs.prebuilt.outputs.prebuilt_sha }}" \
            --tag "$RELEASE_TAG" --out /tmp/rpm-bin
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'veshell-*.tar.zst' --dir /tmp/rpm-bin
          COPR_CONFIG="$RUNNER_TEMP/copr" \
            packaging/scripts/copr-publish.sh /tmp/rpm-bin "$COPR_PROJECT"

  obs:
    name: Publish to OBS
    needs: [validate, prebuilt]
    runs-on: ubuntu-24.04
    container: opensuse/tumbleweed:latest
    timeout-minutes: 45
    steps:
      - name: Install tooling
        shell: bash
        run: zypper --non-interactive install git python3 osc curl

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Render the binary recipe and submit to OBS
        shell: bash
        env:
          OSC_CONFIG_CONTENT: ${{ secrets.OSC_CONFIG }}
          OBS_PROJECT: ${{ vars.OBS_PROJECT || 'home:free-explorers' }}
          OBS_PACKAGE: ${{ vars.OBS_PACKAGE || 'veshell' }}
        run: |
          set -euo pipefail
          if [[ -z "${OSC_CONFIG_CONTENT:-}" ]]; then
            echo "OSC_CONFIG is not configured; skipping the OBS publish." >&2
            exit 0
          fi
          install -d -m700 "$RUNNER_TEMP/osc"
          printf '%s\n' "$OSC_CONFIG_CONTENT" > "$RUNNER_TEMP/osc/oscrc"
          chmod 600 "$RUNNER_TEMP/osc/oscrc"
          rm -rf /tmp/rpm-bin
          python3 packaging/scripts/gen-bin-recipes.py --format rpm \
            --prebuilt-sha "${{ needs.prebuilt.outputs.prebuilt_sha }}" \
            --tag "$RELEASE_TAG" --out /tmp/rpm-bin
          asset="veshell-${{ needs.validate.outputs.release_id }}-x86_64.tar.zst"
          curl -fsSL -o "/tmp/rpm-bin/$asset" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$asset"
          OSC_CONFIG="$RUNNER_TEMP/osc/oscrc" \
            packaging/scripts/obs-publish.sh /tmp/rpm-bin "$OBS_PROJECT" "$OBS_PACKAGE"

  nix:
    name: Publish the Nix channel
    needs: [validate, prebuilt]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/nix-package-release.yml
