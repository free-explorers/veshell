name: Flutter Engine Cache

# Triggered by merging a Bump Flutter Version pull request (head bump/flutter*):
# that PR is where the new flutter_version and its provenance are reviewed, so
# it — not a file diff or a cache lookup — is the switch. When the engine is
# already published, `nix build` substitutes it from the cache.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: flutter-engine-cache
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether a Flutter bump was merged
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pr="$(gh api "repos/${{ github.repository }}/commits/$GITHUB_SHA/pulls" --jq '.[0] // empty')"
          ref=""
          [[ -n "$pr" ]] && ref="$(printf '%s' "$pr" | jq -r '.head.ref')"
          if [[ "$ref" != bump/flutter* ]]; then
            echo "not a Flutter bump (${ref:-no pull request}); skipping" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Flutter bump $ref merged; building the engine" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reclaim unused runner tools and require 30 GiB
        if: steps.decide.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h / /mnt
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          available=$(df --output=avail -B1 / | tr -dc '0-9')
          (( available >= 30 * 1024 * 1024 * 1024 ))

      - name: Install Nix
        if: steps.decide.outputs.run == 'true'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            max-jobs = 1
            cores = 4
            experimental-features = nix-command flakes

      - name: Use the project cache
        if: steps.decide.outputs.run == 'true'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: veshell
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and publish the engine and runtime
        if: steps.decide.outputs.run == 'true'
        timeout-minutes: 300
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t roots < <(
            nix build .#engine .#runtime --print-out-paths --no-link \
              --max-jobs 1 --cores 4
          )
          printf '%s\n' "${roots[@]}"
          cachix push veshell "${roots[@]}"

      - name: Final resource sample
        if: always()
        shell: bash
        run: |
          free -h
          df -h / /mnt
