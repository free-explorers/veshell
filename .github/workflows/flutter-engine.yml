name: Flutter Engine Cache

# Keyed on the Flutter version. When Cargo.toml's flutter_version reaches main
# with a new value (or the engine pin changes), the source engine is built and
# pushed to the project Cachix cache. When it is already cached, `nix build`
# substitutes it, so no separate cache lookup is needed.

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - nix/engine-repository.json
      - nix/engine.nix
      - flake.nix
      - flake.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-engine-cache
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the Flutter version changed
        id: decide
        run: |
          set -euo pipefail
          flutter_version() {
            python3 - "$1" <<'PY'
          import sys, tomllib
          print(tomllib.load(open(sys.argv[1], "rb"))["package"]["metadata"]["flutter_version"])
          PY
          }
          current=$(flutter_version Cargo.toml)
          before="${{ github.event.before }}"
          previous=""
          if [[ -n "$before" && "$before" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$before:Cargo.toml" 2>/dev/null; then
            git show "$before:Cargo.toml" > "$RUNNER_TEMP/before.toml"
            previous=$(flutter_version "$RUNNER_TEMP/before.toml")
          fi
          engine_pin_changed=false
          if [[ -n "$before" && "$before" != 0000000000000000000000000000000000000000 ]]; then
            git diff --name-only "$before" HEAD | grep -qx 'nix/engine-repository.json' && engine_pin_changed=true
          fi
          {
            echo "flutter_version: ${previous:-<none>} -> $current"
            echo "engine pin changed: $engine_pin_changed"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$current" != "$previous" || "$engine_pin_changed" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reclaim unused runner tools and require 30 GiB
        if: steps.decide.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h / /mnt
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          available=$(df --output=avail -B1 / | tr -dc '0-9')
          (( available >= 30 * 1024 * 1024 * 1024 ))

      - name: Install Nix
        if: steps.decide.outputs.build == 'true'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            max-jobs = 1
            cores = 4
            experimental-features = nix-command flakes

      - name: Use the project cache
        if: steps.decide.outputs.build == 'true'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: veshell
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and publish the engine and runtime
        if: steps.decide.outputs.build == 'true'
        timeout-minutes: 300
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t roots < <(
            nix build .#engine .#runtime --print-out-paths --no-link \
              --max-jobs 1 --cores 4
          )
          printf '%s\n' "${roots[@]}"
          cachix push veshell "${roots[@]}"

      - name: Final resource sample
        if: always()
        shell: bash
        run: |
          free -h
          df -h / /mnt
